<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Óscar</title>
<meta name="description" content="Get in touch with Óscar to talk about your next graphic design or art direction project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261017">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" href="index.html">@oti</a>
  <nav class="main-nav" aria-label="Main navigation">
    <a href="index.html">Selected Work</a>
    <a href="archivo.html">Archive</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <button class="menu-toggle" aria-expanded="false" aria-controls="mobile-menu">Menu</button>
</header>

<nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
  <a href="index.html">Selected Work</a>
  <a href="archivo.html">Archive</a>
  <a href="contact.html">Contact</a>
</nav>

<main id="main" class="billboard-page">
  <article class="billboard" aria-labelledby="bb-title">
    <header class="bb-top">
      <span class="bb-tag">09 — Contact</span>
      <span class="bb-tag">Graphic design &amp; art direction</span>
    </header>

    <div class="bb-body">
      <h1 class="bb-title" id="bb-title">
        <span class="bb-line"><span>Have a</span></span>
        <span class="bb-line"><span>project</span></span>
        <span class="bb-line"><span><em>in mind?</em></span></span>
      </h1>

      <div class="bb-aside">
        <p class="bb-lede">Tell me what you're making and what it needs. I read every message.</p>
        <div class="bb-meta">
          <a class="bb-email" href="mailto:hola@oscardiseno.com">hola@oscardiseno.com</a>
          <button class="copy-email" type="button" data-email="hola@oscardiseno.com">Copy</button>
        </div>
        <nav class="bb-links bb-meta" aria-label="Contact links">
          <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
          <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
        </nav>
      </div>

      <form class="bb-form" id="bb-form" data-to="hola@oscardiseno.com">
        <div class="bb-field">
          <label for="bb-name"><span class="bb-num">01</span> Name</label>
          <input id="bb-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
        </div>
        <div class="bb-field">
          <label for="bb-email"><span class="bb-num">02</span> Email</label>
          <input id="bb-email" name="email" type="email" autocomplete="email" placeholder="you@studio.com" required>
        </div>
        <fieldset class="bb-types">
          <legend><span class="bb-num">03</span> Project</legend>
          <div class="bb-chips">
            <label class="bb-chip"><input type="radio" name="type" value="Branding"><span>Branding</span></label>
            <label class="bb-chip"><input type="radio" name="type" value="Website"><span>Website</span></label>
            <label class="bb-chip"><input type="radio" name="type" value="Editorial"><span>Editorial</span></label>
            <label class="bb-chip"><input type="radio" name="type" value="Other"><span>Other</span></label>
          </div>
        </fieldset>
        <div class="bb-field">
          <label for="bb-message"><span class="bb-num">04</span> Message</label>
          <textarea id="bb-message" name="message" rows="3" placeholder="What are we making?" required></textarea>
        </div>
        <button class="bb-submit" type="submit"><span>Send proposal</span><span aria-hidden="true">→</span></button>
        <p class="bb-status" id="bb-status" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </article>
</main>

<script src="js/main.js?v=20261017"></script>
</body>
</html>
