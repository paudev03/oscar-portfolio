<main id="main" class="arch">
  <header class="arch-head">
    <h1 class="visually-hidden">Archive</h1>

    <div class="arch-controls" id="controls">
      <div class="arch-filter" id="filter">
        <button class="arch-filter-btn" id="filter-btn" type="button" aria-expanded="false" aria-controls="filter-menu" aria-haspopup="true">
          <span class="arch-filter-label" id="filter-label">Filtrar</span>
          <span class="arch-filter-icon" aria-hidden="true"></span>
        </button>
        <div class="arch-filter-menu" id="filter-menu" role="group" aria-label="Filtrar por categoría"></div>
      </div>
      <div class="arch-tools">
        <label class="arch-search">
          <span class="visually-hidden">Buscar en el archivo</span>
          <input id="search" type="search" placeholder="Buscar…" autocomplete="off" spellcheck="false">
        </label>
        <p class="arch-count" id="count" aria-live="polite"></p>
        <button class="arch-reset" id="reset" type="button" hidden>Mostrar todo</button>
      </div>
    </div>
  </header>

  <!-- Lienzo: la cámara (posición + zoom) vive en js/archivo.js -->
  <section class="arch-stage" id="stage" tabindex="0"
           aria-label="Lienzo del archivo. Arrastra para moverte, rueda o botones para el zoom, flechas del teclado para desplazarte.">
    <div class="arch-world" id="board">
      <noscript><p class="arch-noscript">El archivo necesita JavaScript para mostrarse.</p></noscript>
    </div>

    <div class="arch-empty arch-ui" id="empty" hidden>
      <p class="arch-empty-title">Nada coincide con <em id="empty-q"></em>.</p>
      <p class="arch-empty-sub">Prueba con otra palabra, otra categoría, o vuelve a ver todo el archivo.</p>
      <button class="arch-reset arch-reset--solid" id="empty-reset" type="button">Limpiar filtros</button>
    </div>

    <div class="arch-nav arch-ui" role="group" aria-label="Controles del lienzo">
      <button type="button" id="zoom-out" class="arch-nav-btn" aria-label="Alejar">−</button>
      <output id="zoom-val" class="arch-nav-val">100 %</output>
      <button type="button" id="zoom-in" class="arch-nav-btn" aria-label="Ampliar">+</button>
      <button type="button" id="fit" class="arch-nav-btn arch-nav-btn--text">Ver todo</button>
    </div>

    <!-- Un solo componente con dos estados: mapa abierto / botón «Mapa» -->
    <aside class="arch-minimap arch-ui" id="minimap" aria-label="Minimapa del archivo">
      <div class="arch-mm-body" id="mm-body">
        <div class="arch-minimap-map" id="mm-map">
          <div class="arch-mm-view" id="mm-view" aria-hidden="true"></div>
        </div>
        <button type="button" class="arch-minimap-fold" id="mm-fold" aria-label="Minimizar minimapa">−</button>
      </div>
      <button type="button" class="arch-mm-label" id="mm-toggle" aria-controls="mm-body" aria-expanded="true">Mapa</button>
    </aside>
  </section>
</main>

<!-- Vista ampliada de una pieza -->
<div class="arch-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="arch-modal-backdrop" data-close></div>
  <div class="arch-modal-panel">
    <button class="arch-modal-close" type="button" data-close aria-label="Cerrar vista ampliada">Cerrar ✕</button>
    <div class="arch-modal-media" id="modal-media">
      <button class="arch-modal-nav arch-modal-nav--prev" id="modal-prev" type="button" aria-label="Pieza anterior de la serie">←</button>
      <figure class="arch-modal-fig" id="modal-fig"></figure>
      <button class="arch-modal-nav arch-modal-nav--next" id="modal-next" type="button" aria-label="Pieza siguiente de la serie">→</button>
    </div>
    <div class="arch-modal-info">
      <p class="arch-modal-kicker" id="modal-kicker"></p>
      <h2 class="arch-modal-title" id="modal-title"></h2>
      <p class="arch-modal-desc" id="modal-desc"></p>
      <ul class="arch-modal-tags" id="modal-tags"></ul>
      <div class="arch-modal-series" id="modal-series" hidden>
        <p class="label" id="modal-series-label"></p>
        <div class="arch-modal-thumbs" id="modal-thumbs"></div>
      </div>
      <div class="arch-modal-related" id="modal-related" hidden>
        <p class="label">Relacionado</p>
        <div class="arch-modal-thumbs" id="modal-related-list"></div>
      </div>
    </div>
  </div>
</div>
