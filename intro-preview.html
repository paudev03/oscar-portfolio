<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OTI — lettering preview</title>
<meta name="theme-color" content="#0B0B0B">
<link rel="stylesheet" href="css/intro.css?v=20261109">
</head>
<body>
<!--
  PHASE 3 (v2) — paint running down the approved OTI lettering, from several letters.
  Not linked from the site, not in the sitemap. The live hero is unchanged.

  The lettering (approved in Phase 2) is unchanged:
    O  wide ring, upright counter nudged right
    T  heavy bar with a slanted right cut, straight stem
    I  flat-topped bar, lower right corner cut on the same slope
  Cap height 360, stroke 120. viewBox 1200 x 600, letters spaced 48 apart.

  The runs (js/intro.js) are pure functions of progress p, so they can be
  scrubbed with the slider, forwards and backwards.
-->
<main class="intro" id="main">
  <svg class="intro-mark" viewBox="0 0 1200 600" role="img" aria-labelledby="intro-title" xmlns="http://www.w3.org/2000/svg">
    <title id="intro-title">OTI</title>

    <defs>
      <!-- volume: light on the upper left, shade on the lower right, kept subtle -->
      <radialGradient id="drop-grad" cx="0.38" cy="0.3" r="0.8">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
        <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#3a372f" stop-opacity="0.42"/>
      </radialGradient>
    </defs>

    <!-- O -->
    <path id="letter-o" fill-rule="evenodd" d="
      M 297 120
      H 317
      A 180 180 0 0 1 317 480
      H 297
      A 180 180 0 0 1 297 120
      Z
      M 247 300
      A 70 90 0 1 0 387 300
      A 70 90 0 1 0 247 300
      Z"/>

    <!-- T -->
    <path id="letter-t" d="
      M 545 120
      H 925
      L 905 210
      H 545
      Z
      M 675 200
      H 795
      V 480
      H 675
      Z"/>

    <!-- I -->
    <path id="letter-i" d="
      M 973 120
      H 1083
      V 390
      L 1063 480
      H 973
      Z"/>

    <!-- paint running down the letters: same ivory as the letters, drawn in its own layer (js/intro.js) -->
    <g id="drops" aria-hidden="true"></g>
  </svg>

  <!-- preview-only controls: scrub the drop (both ways) or replay it. R also replays. -->
  <div class="intro-ctl" role="group" aria-label="Preview controls">
    <button type="button" id="drop-replay">Replay</button>
    <input type="range" id="drop-scrub" min="0" max="1000" value="0" aria-label="Progress">
  </div>
</main>
<script src="js/intro.js?v=20261109"></script>
</body>
</html>
